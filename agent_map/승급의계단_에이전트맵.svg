  <text x="690" y="914" text-anchor="middle" font-size="16" font-weight="700" class="lt">PC 웹 브라우저용 게임 (1~100층 · 무한 모드 · 연습 모드)</text>
  <text x="690" y="940" text-anchor="middle" font-size="13" class="lt">demo/ · demo_api/ · output/dist/승급의계단_PoC_web.zip</text>

