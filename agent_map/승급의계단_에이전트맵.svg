  <text x="1345" y="1066" text-anchor="middle" class="t2" font-size="12">tools/playtest.py (유형별 실시간 키 입력) · tools/sim_spec.py</text>
  <text x="1345" y="1086" text-anchor="middle" class="t2" font-size="12">전체화면 직접 플레이 → docs/PLAYTEST_REPORT.md</text>

  <rect x="620" y="1012" width="460" height="92" rx="12" fill="#FFFFFF" stroke="#5A5F66" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="850" y="1038" text-anchor="middle" class="t1" font-size="14">LLM 호출 계층 (llm.py)</text>
  <text x="850" y="1058" text-anchor="middle" class="t2" font-size="12">Claude API · 재생(replay/, replay_api/) · 기록(--record)</text>
  <text x="850" y="1076" text-anchor="middle" class="t2" font-size="12">QA는 이미지도 함께 보내 시각 검토를 받는다</text>
  <text x="850" y="1094" text-anchor="middle" class="t3">재생 모드는 응답이 같으므로 QA 고침 반복을 1번만 돈다</text>

  <rect x="40" y="992" width="540" height="152" rx="12" fill="#FFFFFF" stroke="#C9CCD1" stroke-width="1.5"/>
  <path d="M60,1018 H130" class="e"/>  <text x="146" y="1022" class="t2" font-size="12">산출물 전달 · 입력</text>
  <path d="M60,1044 H130" class="ed"/> <text x="146" y="1048" class="t2" font-size="12">참조 (원본 리소스 · 공통 에셋 목록 · 컨셉 참고)</text>
  <path d="M60,1070 H130" class="eo"/> <text x="146" y="1074" class="t2" font-size="12">QA 고침 반복: pass가 아니면 고칠 점을 돌려줘 다시 (최대 11번)</text>
  <path d="M60,1096 H130" class="er"/> <text x="146" y="1100" class="t2" font-size="12">플레이테스트 피드백 (수치 → Mechanics, 화면·문구 → Developer)</text>
  <text x="60" y="1126" class="t3">실행 순서: ① Mechanics → ② (Designer → Designer QA) ∥ (Developer → Developer QA)</text>
  <text x="60" y="1140" class="t3">→ ③ Publisher → 화면 대조 QA → ④ 검증</text>

