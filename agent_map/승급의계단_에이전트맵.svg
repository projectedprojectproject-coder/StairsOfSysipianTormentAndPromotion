  <rect width="1600" height="1170" fill="#FFFFFF"/>

  <!-- 제목 -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1E1F22">승급의 계단 에이전트 맵</text>
  <text x="40" y="68" font-size="13" fill="#5A5F66">v3 · 2026-11-20 · QA 에이전트와 고침 반복(최대 11번), 컨셉 아트와 스프라이트 뽑기, 화면 대조 QA, 1~100층 · 무한 · 연습 모드</text>

  <!-- ===== 1줄: 입력 ===== -->
  <!-- 원본 리소스 DB -->
  <path d="M40,108 A145,14 0 0 1 330,108 V178 A145,14 0 0 1 40,178 Z" class="paper"/>
  <path d="M40,108 A145,14 0 0 0 330,108" fill="none" stroke="#5A5F66" stroke-width="1.5"/>
  <text x="185" y="140" text-anchor="middle" class="t1" font-size="14">원본 리소스 데이터베이스</text>
  <text x="185" y="159" text-anchor="middle" class="t2" font-size="12">data/원본리소스_DB.json</text>
  <text x="185" y="176" text-anchor="middle" class="t3">스타일 · 배경 · 사운드 (Designer 전용)</text>

  <!-- 기획서 -->
  <rect x="560" y="92" width="480" height="92" rx="16" fill="#1E1F22"/>
