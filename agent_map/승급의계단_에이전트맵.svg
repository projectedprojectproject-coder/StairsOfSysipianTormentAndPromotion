  <text x="255" y="548" text-anchor="middle" class="t1">Designer QA <tspan fill="#6E7A49" font-size="12">v3 추가</tspan></text>
  <text x="255" y="570" text-anchor="middle" class="t2" font-size="12">에셋 계약 · 빈 프레임 · 2배 밀도 · 팔레트 · 컨셉 대조(색 거리 · 실루엣)</text>
  <text x="255" y="588" text-anchor="middle" class="t2" font-size="12">+ Claude 시각 검토 (컨셉 | 만든 프레임 대조표)</text>
  <text x="255" y="606" text-anchor="middle" class="t3">qa_designer.py · prompts/qa_designer.md → qa_out/designer_qa.md</text>

  <rect x="1130" y="516" width="430" height="100" rx="14" class="qa"/>
  <rect x="1144" y="528" width="70" height="22" rx="11" fill="#6E7A49"/>
  <text x="1179" y="543" text-anchor="middle" class="pill">QA</text>
  <text x="1345" y="548" text-anchor="middle" class="t1">Developer QA <tspan fill="#6E7A49" font-size="12">v3 추가</tspan></text>
  <text x="1345" y="570" text-anchor="middle" class="t2" font-size="12">JS 문법 · CONFIG 수치 · 조작 키 · 화면 5종 · 정의 계약 · 외부 요청 없음</text>
  <text x="1345" y="588" text-anchor="middle" class="t2" font-size="12">+ Claude 코드 검토 (판정 규칙 · 진행 · 버그 위험)</text>
  <text x="1345" y="606" text-anchor="middle" class="t3">qa_developer.py · prompts/qa_developer.md → qa_out/developer_qa.md</text>

