  <rect x="1130" y="1012" width="430" height="92" rx="14" fill="#FFFFFF" stroke="#A13D3D" stroke-width="2.5"/>
  <rect x="1144" y="1024" width="70" height="22" rx="11" fill="#A13D3D"/>
