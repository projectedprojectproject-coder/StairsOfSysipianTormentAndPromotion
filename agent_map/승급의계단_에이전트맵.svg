  <text x="255" y="700" text-anchor="middle" class="t2" font-size="12">PNG 스프라이트 맵 · 이미지 · WAV</text>

  <path d="M1150,660 L1180,646 H1210 L1224,660 H1340 V708 H1150 Z" class="paper"/>
  <text x="1245" y="682" text-anchor="middle" class="t1" font-size="15">코드</text>
