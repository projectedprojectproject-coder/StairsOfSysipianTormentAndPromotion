  <text x="800" y="148" text-anchor="middle" font-size="13" class="lt">00 비전 캔버스 · 01 게임 컨셉 · 02 게임 스토리</text>
  <text x="800" y="168" text-anchor="middle" font-size="13" class="lt">03 디자인 컨셉 · 04 게임 메카니즘 · 05 화면 설계서</text>

  <!-- 컨셉 아트 -->
  <path d="M1180,92 H1540 L1560,112 V184 H1180 Z" class="paper"/>
  <path d="M1540,92 V112 H1560" fill="none" stroke="#5A5F66" stroke-width="1.5"/>
  <text x="1370" y="120" text-anchor="middle" class="t1" font-size="15">컨셉 아트 <tspan fill="#6E7A49" font-size="12">v3 추가</tspan></text>
  <text x="1370" y="142" text-anchor="middle" class="t2" font-size="12">data/concept/ 05-1 타이틀 · 05-2 로비 · 05-3 플레이 · 05-5 결과</text>
  <text x="1370" y="162" text-anchor="middle" class="t3">regions.json: 뽑을 영역 · 화면별 번호 요소</text>
  <text x="1370" y="177" text-anchor="middle" class="t3">(Figma 컨셉 이미지를 내보낸 것)</text>

  <!-- ===== 2줄: Mechanics, 컨셉 스프라이트 뽑기 ===== -->
  <rect x="580" y="214" width="440" height="104" rx="14" fill="#E8E6DF" stroke="#8A9A5B" stroke-width="3.5"/>
  <rect x="594" y="226" width="104" height="22" rx="11" fill="#6E7A49"/>
  <text x="646" y="241" text-anchor="middle" class="pill">① 먼저 실행</text>
  <text x="800" y="248" text-anchor="middle" class="t1">Mechanics</text>
  <text x="800" y="271" text-anchor="middle" class="t2">기획서 04로 1~100층 규칙과 수치를 확정 (코드는 쓰지 않음)</text>
  <text x="800" y="291" text-anchor="middle" class="t2">검사기 validate() 통과 못 하면 최대 2회 다시 요청</text>
  <text x="800" y="310" text-anchor="middle" class="t3">stairs_agents/mechanics.py · prompts/mechanics.md</text>

  <rect x="1180" y="214" width="380" height="96" rx="12" fill="#FFFFFF" stroke="#6E7A49" stroke-width="2"/>
  <text x="1370" y="240" text-anchor="middle" class="t1" font-size="14">컨셉 스프라이트 뽑기 <tspan fill="#6E7A49" font-size="12">v3 추가</tspan></text>
  <text x="1370" y="260" text-anchor="middle" class="t2" font-size="12">영역 자르기 → 배경 지우기 → 프레임 크기 → 색 줄이기</text>
  <text x="1370" y="278" text-anchor="middle" class="t2" font-size="12">→ Designer 명세와 같은 글자 격자와 참고 PNG</text>
  <text x="1370" y="298" text-anchor="middle" class="t3">concept.py · 스킬 .claude/skills/concept-sprite-extraction</text>

  <!-- ===== 3줄: 생산 에이전트와 공통 문서 ===== -->
  <!-- Designer -->
  <rect x="40" y="352" width="430" height="112" rx="14" class="agent"/>
  <rect x="54" y="364" width="92" height="22" rx="11" fill="#5A5F66"/>
  <text x="100" y="379" text-anchor="middle" class="pill">② 동시 실행</text>
  <text x="255" y="388" text-anchor="middle" class="t1">Designer</text>
  <text x="255" y="411" text-anchor="middle" class="t2">스프라이트 · 배경 · 사운드를 에셋별로 설계 (2배 밀도)</text>
  <text x="255" y="431" text-anchor="middle" class="t2">명세(JSON)를 PNG 스프라이트 맵과 WAV로 렌더링</text>
  <text x="255" y="452" text-anchor="middle" class="t3">designer.py · render.py · synth.py · prompts/designer_*.md</text>

  <!-- Developer -->
  <rect x="1130" y="352" width="430" height="112" rx="14" class="agent"/>
  <rect x="1144" y="364" width="92" height="22" rx="11" fill="#5A5F66"/>
  <text x="1190" y="379" text-anchor="middle" class="pill">② 동시 실행</text>
  <text x="1345" y="388" text-anchor="middle" class="t1">Developer</text>
  <text x="1345" y="411" text-anchor="middle" class="t2">코드 · 시스템 · 스프라이트 정의 (보통 · 무한 · 연습 모드)</text>
  <text x="1345" y="431" text-anchor="middle" class="t2">mechanics.json이 있으면 수치를 그대로 옮김</text>
  <text x="1345" y="452" text-anchor="middle" class="t3">developer.py · prompts/developer.md</text>

