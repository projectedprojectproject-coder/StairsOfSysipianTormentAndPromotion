  <text x="1460" y="703" text-anchor="middle" class="t3">사운드 MP3 · OGG</text>

  <!-- ===== 6줄: Publisher ===== -->
  <rect x="300" y="742" width="780" height="104" rx="14" fill="#E8E6DF" stroke="#A13D3D" stroke-width="3.5"/>
  <rect x="314" y="754" width="104" height="22" rx="11" fill="#A13D3D"/>
  <text x="366" y="769" text-anchor="middle" class="pill">③ 마지막 실행</text>
  <text x="690" y="774" text-anchor="middle" class="t1">Publisher</text>
  <text x="690" y="796" text-anchor="middle" class="t2" font-size="12">1. 확장자를 스프라이트 정의와 비교해 변환 (WAV → OGG · MP3)   2. 코드와 디자인 파일 연결</text>
  <text x="690" y="815" text-anchor="middle" class="t2" font-size="12">3. Playwright 동작 확인 9개 항목 (100층 승급 · 게임 오버 · 일시정지 · file:// 등)</text>
  <text x="690" y="834" text-anchor="middle" class="t2" font-size="12">4. 게임 내보내기 (zip · publisher_report.md · 화면 캡처 · QA 보고서)</text>

  <!-- ===== 7줄: 게임, 화면 대조 QA ===== -->
